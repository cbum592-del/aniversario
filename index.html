<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carta de Aniversario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mrs+Saint+Delafield&family=Libre+Baskerville:ital@0;1&family=Caveat:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Concepto: carta de amor por pasos. Una sola pantalla visible a la vez, fondo vino, botones rosa pastel. */
:root {
  --bg: #2e0000;
  --bg-soft: #4a0a14;
  --ink: #fff4f1;
  --ink-soft: #e9c9cc;
  --pill: #ffc2cc;
  --pill-ink: #3a0a12;
  --pill-hover: #ffd3da;
  --paper: #fbf3e4;
  --paper-line: rgba(140, 100, 85, .22);
  --ink-hand: #3a2320;
  --seal: #8f1d2c;
  --seal-hi: #b3283b;
  --font-hand: "Caveat", "Segoe Script", "Bradley Hand", cursive;
  --heart: #ff6b88;
  --font-script: "Mrs Saint Delafield", "Snell Roundhand", cursive;
  --font-serif: "Libre Baskerville", Georgia, "Times New Roman", serif;
  color-scheme: dark;
}
/* La página es una sola atmósfera oscura a propósito, igual en tema claro y oscuro. */
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: radial-gradient(ellipse at 50% 25%, var(--bg-soft) 0%, var(--bg) 70%) fixed, var(--bg);
  color: var(--ink);
  font-family: var(--font-serif);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px;
  overflow-x: hidden;
}
.screen {
  display: none;
  min-height: calc(100% - 0px);
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 22px;
  text-align: center;
  max-width: 720px;
  margin: 0 auto;
  padding-block: 24px;
}
.screen.active { display: flex; animation: fade .7s ease both; }
@keyframes fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

h1, h2 {
  font-family: var(--font-script);
  font-weight: 400;
  margin: 0;
  line-height: 1;
  text-wrap: balance;
}
h1 { font-size: clamp(3.4rem, 13vw, 6.2rem); }
h2 { font-size: clamp(2.6rem, 9vw, 4.4rem); }
p { margin: 0; line-height: 1.8; font-size: clamp(1rem, 2.6vw, 1.12rem); }
.sub { color: var(--ink-soft); font-style: italic; }

.btn {
  font-family: var(--font-serif);
  font-size: 1.05rem;
  background: var(--pill);
  color: var(--pill-ink);
  border: 0;
  border-radius: 999px;
  padding: 14px 34px;
  min-width: 190px;
  cursor: pointer;
  transition: transform .15s ease, background .15s ease;
}
.btn:hover { transform: translateY(-2px); background: #ffd3da; }
.btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.btns { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; align-items: center; }

/* Sobre */
.envelope {
  position: relative;
  width: min(380px, 80vw);
  aspect-ratio: 3 / 2;
  background: #5a2a2e;
  border-radius: 6px;
  cursor: pointer;
  box-shadow: 0 18px 40px rgba(0,0,0,.45);
  transition: transform .3s ease;
}
.envelope:hover { transform: scale(1.02); }
.envelope .flap {
  position: absolute; inset: 0 0 auto 0; height: 58%;
  background: #6b3438;
  clip-path: polygon(0 0, 100% 0, 50% 100%);
  transform-origin: top; transition: transform .6s ease;
}
.envelope .front {
  position: absolute; inset: 0;
  background: linear-gradient(135deg, transparent 49.5%, #4d2125 50%) left / 50% 100% no-repeat,
              linear-gradient(225deg, transparent 49.5%, #4d2125 50%) right / 50% 100% no-repeat;
}
.envelope .seal {
  position: absolute; left: 50%; top: 52%; translate: -50% -50%;
  width: 54px; height: 54px; border-radius: 50%;
  background: var(--heart); display: grid; place-items: center;
  box-shadow: 0 4px 10px rgba(0,0,0,.4); z-index: 2;
}
.envelope.open .flap { transform: rotateX(180deg); }

/* Carta */
.letter { max-width: 600px; display: flex; flex-direction: column; gap: 18px; text-align: left; }
.letter p { text-align: left; }
.letter .signature { font-family: var(--font-script); font-size: 3rem; text-align: right; line-height: 1; }
.song {
  width: min(440px, 100%);
  background: var(--bg-soft);
  border-radius: 14px;
  padding: 12px 16px;
  display: flex; align-items: center; gap: 14px; text-align: left;
}
.song .disc { width: 52px; height: 52px; border-radius: 8px; background: var(--heart); display: grid; place-items: center; flex: none; }
.song b { display: block; font-size: .95rem; }
.song small { color: var(--ink-soft); }
.song iframe { width: 100%; border: 0; border-radius: 12px; }

/* Pregunta */
.heart-big { width: 150px; height: 150px; animation: beat 1.4s ease-in-out infinite; filter: drop-shadow(0 10px 18px rgba(0,0,0,.4)); }
@keyframes beat { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.12); } 30% { transform: scale(1); } 45% { transform: scale(1.08); } }
.arena { position: relative; width: min(560px, 100%); min-height: 120px; display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; align-items: center; }
#btnSi { transition: transform .25s ease; transform: scale(var(--s, 1)); }

/* Final */
.photo {
  width: min(440px, 88vw); aspect-ratio: 16 / 9; object-fit: cover; border-radius: 10px;
  border: 8px solid #fff4f1; box-shadow: 0 14px 34px rgba(0,0,0,.5); transform: rotate(-2deg); background: var(--bg-soft);
}
.photo-ph { display: grid; place-items: center; color: var(--ink-soft); font-style: italic; padding: 16px; font-size: .95rem; }
.counter { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.counter div { background: var(--bg-soft); border-radius: 12px; padding: 12px 18px; min-width: 84px; }
.counter b { display: block; font-size: 1.7rem; font-variant-numeric: tabular-nums; }
.counter span { font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }

/* Corazones flotando */
#hearts { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
.screen { position: relative; z-index: 1; }
.fly { position: absolute; bottom: -50px; opacity: 0; will-change: transform; animation: up var(--d, 7s) ease-in forwards; animation-delay: var(--dl, 0s); }
@keyframes up {
  0%   { transform: translate(0, 0) rotate(0) scale(.6); opacity: 0; }
  10%  { opacity: .85; }
  50%  { transform: translate(var(--dx, 20px), -55vh) rotate(var(--r, 10deg)) scale(1); }
  100% { transform: translate(calc(var(--dx, 20px) * -1), -115vh) rotate(calc(var(--r, 10deg) * -1)) scale(1.05); opacity: 0; }
}
.pop { position: fixed; translate: -50% -50%; opacity: 0; animation: pop 1.6s cubic-bezier(.15,.8,.3,1) forwards; }
@keyframes pop {
  0%   { transform: translate(0, 0) scale(.2); opacity: 0; }
  15%  { opacity: 1; }
  100% { transform: translate(var(--bx), var(--by)) scale(1.1); opacity: 0; }
}
/* La carta aparece párrafo por párrafo */
.letter p, .letter .signature { animation: rise .9s ease both; animation-delay: calc(var(--i, 0) * .7s + .5s); }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
#t-carta, #t-pregunta, #t-final { text-shadow: 0 0 28px rgba(255, 107, 136, .4); }


/* ===================== CARTA VIRTUAL (debajo del contador) ===================== */
.cv { width: 100%; max-width: 640px; margin-top: 30px; padding-top: 30px; border-top: 1px solid rgba(255, 194, 204, .18); display: flex; flex-direction: column; align-items: center; gap: 22px; }
.cv [hidden] { display: none !important; }
.cv button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.cv-step { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 16px; animation: fade .7s ease both; }
.cv-title { font-family: var(--font-script); font-weight: 400; font-size: clamp(2.4rem, 8vw, 3.4rem); line-height: 1; margin: 0; text-wrap: balance; text-shadow: 0 0 28px rgba(255, 107, 136, .4); }
.cv-hint { color: var(--ink-soft); font-style: italic; font-size: .98rem; }

/* Paso 1: sello de cera */
.cv-seal, .cv-hold {
  position: relative; border: 0; cursor: pointer; color: #ffe9ec; font-family: var(--font-serif);
  border-radius: 52% 48% 50% 50% / 50% 52% 48% 50%;
  background: radial-gradient(circle at 35% 30%, var(--seal-hi), var(--seal) 60%, #5e0f1a);
  box-shadow: 0 10px 24px rgba(0,0,0,.5), inset 0 -6px 10px rgba(0,0,0,.35), inset 0 4px 8px rgba(255,255,255,.18);
}
.cv-seal { width: 136px; height: 136px; display: grid; place-content: center; text-align: center; animation: sealpulse 2.6s ease-in-out infinite; }
.cv-seal::before { content: ""; position: absolute; inset: 11px; border-radius: 50%; border: 2px dashed rgba(255, 233, 236, .45); }
.cv-seal b { font-size: 2.4rem; line-height: 1; }
.cv-seal span { font-size: .7rem; letter-spacing: .16em; text-transform: uppercase; opacity: .85; }
@keyframes sealpulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
.cv-seal.break { animation: sealbreak .7s ease forwards; }
@keyframes sealbreak { 35% { transform: scale(1.12) rotate(-6deg); } 100% { transform: scale(1.5) rotate(10deg); opacity: 0; } }

/* Paso 2: pistas */
.cv-clues { width: 100%; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.cv-clue {
  text-align: left; display: flex; flex-direction: column; gap: 10px; min-width: 0; min-height: 104px; padding: 14px;
  background: var(--bg-soft); color: var(--ink); border: 1px solid rgba(255, 194, 204, .25); border-radius: 14px;
  font-family: var(--font-serif); font-size: .95rem; cursor: pointer; transition: transform .15s ease, border-color .2s ease;
}
.cv-clue:hover { transform: translateY(-2px); }
.cv-clue .ico { width: 34px; height: 34px; border-radius: 50%; background: var(--pill); color: var(--pill-ink); display: grid; place-items: center; }
.cv-clue .memo { font-family: var(--font-hand); font-size: 1.3rem; line-height: 1.25; color: var(--ink-soft); animation: fade .6s ease both; }
.cv-clue.done { border-color: var(--pill); cursor: default; }
.cv-clue.done:hover { transform: none; }
.cv-dots { display: flex; gap: 8px; }
.cv-dots i { width: 10px; height: 10px; border-radius: 50%; background: rgba(255, 194, 204, .25); transition: background .3s ease, transform .3s ease; }
.cv-dots i.on { background: var(--heart); transform: scale(1.25); }

/* Paso 3: hoja manuscrita */
.cv-paper {
  --lh: 2.15rem;
  position: relative; width: 100%; text-align: left; transform: rotate(-.4deg);
  background-color: var(--paper); color: var(--ink-hand); border-radius: 6px;
  padding: var(--lh) 22px var(--lh) 54px;
  background-image: repeating-linear-gradient(to bottom, transparent 0, transparent calc(var(--lh) - 1px), var(--paper-line) calc(var(--lh) - 1px), var(--paper-line) var(--lh));
  box-shadow: 0 18px 40px rgba(0, 0, 0, .5);
}
.cv-paper::before { content: ""; position: absolute; top: 0; bottom: 0; left: 40px; width: 1px; background: rgba(190, 60, 70, .35); }
.cv-greet, .cv-p, .cv-pd { font-family: var(--font-hand); font-size: 1.5rem; line-height: var(--lh); margin: 0 0 var(--lh); }
.cv-greet { font-weight: 600; font-size: 1.7rem; }
.cv-p { animation: ink .9s ease both; }
@keyframes ink { from { opacity: 0; transform: translateY(8px); filter: blur(3px); } to { opacity: 1; transform: none; filter: none; } }
.cv-sign { font-family: var(--font-script); font-size: 3.2rem; line-height: 1; text-align: right; margin: 0 0 var(--lh); animation: ink .9s ease both; }
.cv-sign small { display: block; font-family: var(--font-hand); font-size: 1.3rem; }
.cv-pd { margin: 0; font-weight: 600; animation: ink 1.2s ease both; }
.cv-actions { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.cv-count { font-size: .82rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }

/* Paso 4: cierre con sello a mantener */
.cv-hold { width: 104px; height: 104px; display: grid; place-items: center; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.cv-hold svg { display: block; }
.cv-hold .ring { position: absolute; inset: -8px; width: calc(100% + 16px); height: calc(100% + 16px); transform: rotate(-90deg); pointer-events: none; }
.cv-hold .ring circle { fill: none; stroke: var(--pill); stroke-width: 4; stroke-linecap: round; stroke-dasharray: 302; stroke-dashoffset: 302; transition: stroke-dashoffset .25s ease; }
.cv-hold.holding .ring circle { stroke-dashoffset: 0; transition: stroke-dashoffset var(--hold, 1.4s) linear; }
.cv-hold.done .ring circle { stroke-dashoffset: 0; transition: none; }
.cv-hold.done { animation: sealpulse 1.8s ease-in-out infinite; cursor: default; }
.cv-final { font-family: var(--font-script); font-size: clamp(2.4rem, 8vw, 3.2rem); line-height: 1; text-align: center; animation: fade .9s ease both; text-shadow: 0 0 28px rgba(255, 107, 136, .4); }

@media (max-width: 520px) {
  .cv-clues { grid-template-columns: 1fr; }
  .cv-clue { min-height: 0; }
  .cv-paper { --lh: 2rem; padding-left: 42px; padding-right: 16px; }
  .cv-paper::before { left: 30px; }
  .cv-greet, .cv-p, .cv-pd { font-size: 1.35rem; }
  .cv-greet { font-size: 1.5rem; }
}
@media (prefers-reduced-motion: reduce) {
  .cv-step, .cv-seal, .cv-p, .cv-sign, .cv-pd, .cv-clue .memo, .cv-final, .cv-hold.done { animation: none; }
  .cv-seal.break { opacity: 0; }
}

@media (prefers-reduced-motion: reduce) {
  .screen.active, .heart-big, .letter p, .letter .signature { animation: none; }
  .fly, .pop { display: none; }
}
</style>

<div id="hearts" aria-hidden="true"></div>

<!-- 1. INICIO -->
<section class="screen active" id="s-inicio">
  <h1 id="t-inicio"></h1>
  <p class="sub" id="t-inicio-sub"></p>
  <button class="btn" data-go="s-sobre" id="b-empezar">Empezar</button>
</section>

<!-- 2. SOBRE -->
<section class="screen" id="s-sobre">
  <div class="envelope" id="envelope" role="button" tabindex="0" aria-label="Abrir el sobre">
    <div class="flap"></div><div class="front"></div>
    <div class="seal"><svg width="26" height="26" viewBox="0 0 24 24" fill="#fff4f1"><path d="M12 21s-7.5-4.6-9.5-9.2C1.2 8.4 3 5 6.4 5c2 0 3.7 1.1 5.6 3.2C13.900 6.100 15.600 5 17.600 5 21 5 22.800 8.400 21.500 11.800 19.500 16.400 12 21 12 21z"/></svg></div>
  </div>
  <div class="btns">
    <button class="btn" id="b-leer">Leer</button>
    <button class="btn" id="b-tiempo">Necesito más tiempo</button>
  </div>
  <p class="sub" id="msg-tiempo" hidden></p>
</section>

<!-- 3. CARTA -->
<section class="screen" id="s-carta">
  <h2 id="t-carta"></h2>
  <div id="song"></div>
  <div class="letter" id="letter"></div>
  <button class="btn" data-go="s-pregunta" id="b-seguir">Continuar</button>
</section>

<!-- 4. PREGUNTA -->
<section class="screen" id="s-pregunta">
  <h2 id="t-pregunta"></h2>
  <svg class="heart-big" viewBox="0 0 24 24" role="img" aria-label="Corazón"><path fill="#ff6b88" d="M12 21s-7.5-4.6-9.5-9.2C1.2 8.4 3 5 6.4 5c2 0 3.700 1.100 5.600 3.200C13.900 6.100 15.600 5 17.600 5 21 5 22.800 8.400 21.500 11.800 19.500 16.400 12 21 12 21z"/><path fill="#fff" fill-opacity=".45" d="M6.500 7.300c-1.300.1-2.300 1.300-2 2.800.1.500.4.800.7.500.2-.2.100-.6.100-1 0-1 .6-1.700 1.400-2 .4-.2.300-.4-.2-.3z"/></svg>
  <div class="arena" id="arena">
    <button class="btn" id="btnSi">Sí</button>
    <button class="btn" id="btnNo">Necesito más tiempo</button>
  </div>
  <p class="sub" id="msg-no" hidden></p>
</section>

<!-- 5. FINAL -->
<section class="screen" id="s-final">
  <h2 id="t-final"></h2>
  <div id="photo-wrap"></div>
  <p id="t-final-texto"></p>
  <div class="counter" id="counter"></div>

  <!-- ===== CARTA VIRTUAL: 1 sello, 2 pistas, 3 carta, 4 cierre ===== -->
  <section class="cv" id="cv" aria-label="Carta virtual">
    <div class="cv-step" id="cv-paso1">
      <h3 class="cv-title" id="cv-t1"></h3>
      <button class="cv-seal" id="cv-seal" type="button" aria-label="Romper el sello para abrir">
        <b id="cv-seal-num"></b><span id="cv-seal-eti"></span>
      </button>
      <p class="cv-hint" id="cv-h1"></p>
    </div>

    <div class="cv-step" id="cv-paso2" hidden>
      <h3 class="cv-title" id="cv-t2"></h3>
      <p class="cv-hint" id="cv-h2"></p>
      <div class="cv-clues" id="cv-clues"></div>
      <div class="cv-dots" id="cv-dots" aria-hidden="true"><i></i><i></i><i></i></div>
      <p class="cv-hint" id="cv-prog" aria-live="polite"></p>
      <button class="btn" id="cv-unlock" type="button" hidden></button>
    </div>

    <div class="cv-step" id="cv-paso3" hidden>
      <article class="cv-paper" id="cv-paper">
        <p class="cv-greet" id="cv-greet"></p>
        <div id="cv-text"></div>
        <div class="cv-sign" id="cv-sign" hidden></div>
        <p class="cv-pd" id="cv-pd" hidden></p>
      </article>
      <div class="cv-actions" id="cv-actions">
        <button class="btn" id="cv-next" type="button"></button>
        <span class="cv-count" id="cv-count" aria-live="polite"></span>
      </div>
      <div class="cv-actions" id="cv-paso4" hidden>
        <button class="cv-hold" id="cv-hold" type="button" aria-label="Mantén presionado el sello para cerrar la carta">
          <svg class="ring" viewBox="0 0 110 110" aria-hidden="true"><circle cx="55" cy="55" r="48"/></svg>
          <svg width="38" height="38" viewBox="0 0 24 24" fill="#ffe9ec" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.5-9.2C1.2 8.4 3 5 6.4 5c2 0 3.7 1.1 5.6 3.2C13.9 6.1 15.6 5 17.6 5 21 5 22.8 8.4 21.5 11.8 19.500 16.400 12 21 12 21z"/></svg>
        </button>
        <p class="cv-hint" id="cv-hold-hint"></p>
        <p class="cv-final" id="cv-final" hidden></p>
      </div>
    </div>
  </section>
  <button class="btn" data-go="s-inicio" id="b-volver">Volver a leer</button>
</section>

  /* ---------- PASO 3: LA CARTA (se revela un párrafo por cada "Continuar") ---------- */
  carta: {
    saludo: `Mi ${CONFIG.nombreElla},`,   // Primera línea, se ve apenas se abre la hoja
    botonContinuar: "Continuar",
    parrafos: [
      // Cada párrafo va entre comillas y termina con coma (el último puede ir sin coma).
      // Puedes agregar o quitar párrafos copiando/borrando un bloque completo.

      /* Párrafo 1: Apertura / el hito */
      "Llegar hasta acá se siente especial. Dos años no son solo un número ni un contador avanzando; son un montón de días compartidos, de aprendizajes y de elegirnos incluso cuando el día viene pesado.",

      /* Párrafo 2: Lo cotidiano y real */
      "Me gusta lo simple que se vuelve estar contigo: conversar de cualquier cosa, apoyarnos en nuestras metas, reírnos de tonterías y tener ese espacio donde puedo ser tal cual soy.",

      /* Párrafo 3: Lo que admiro de ti */
      "Admiro tu forma de ser, tu constancia y cómo haces que los momentos normales se sientan distintos. Gracias por la paciencia, por los detalles y por estar tan presente en mi vida.",

      /* Párrafo 4: Lo que hemos construido */
      "No todo ha sido perfecto, pero sí real. Cada etapa que hemos pasado nos ha ido dando más complicidad y más razones para valorar lo que tenemos.",

      /* Párrafo 5: Cierre y mirada adelante */
      "Esta carta es solo una forma de dejarte por escrito lo que a veces se queda corto al decirlo rápido. Feliz aniversario, Ari... gracias por estos dos años y por todo lo que viene."
    ],
    firma: "Tu novio",                  // Firma grande, en letra cursiva
    firmaNombre: CONFIG.tuNombre        // Nombre pequeño bajo la firma
  },

  /* ---------- PASO 4: EL CIERRE (mantener presionado el sello) ---------- */
  cierre: {
    pista: "Mantén presionado el sello para cerrar la carta",
    msMantener: 1400,                   // Cuánto tiempo hay que mantener (milisegundos)
    posdata: "",                        // Opcional: si escribes algo aquí, aparece en la hoja al cerrar el sello. Vacío = no se muestra
    mensajeFinal: `Feliz aniversario, ${CONFIG.nombreElla}.`
  }
};
/* ============================================================ */

const $ = (id) => document.getElementById(id);
const fmt = (s) => String(s).replace(/\{anios\}/g, CONFIG.anios);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* Textos */
$("t-inicio").textContent = `${CONFIG.tituloInicio}, ${CONFIG.nombreElla}`;
$("t-inicio-sub").textContent = fmt(CONFIG.subInicio);
$("t-carta").textContent = CONFIG.tituloCarta;
$("t-pregunta").textContent = CONFIG.pregunta;
$("btnSi").textContent = CONFIG.textoSi;
$("btnNo").textContent = CONFIG.textoNo;
$("b-tiempo").textContent = CONFIG.textoNo;
$("t-final").textContent = CONFIG.tituloFinal;
$("t-final-texto").textContent = fmt(CONFIG.textoFinal);
document.title = "Carta de Aniversario";

/* Carta */
$("letter").innerHTML = CONFIG.carta.map((p, i) => `<p style="--i:${i}">${esc(fmt(p))}</p>`).join("") +
  `<div class="signature" style="--i:${CONFIG.carta.length}">${esc(CONFIG.firma)}<br><small style="font-family:var(--font-serif);font-size:.9rem;color:var(--ink-soft)">${esc(CONFIG.tuNombre)}</small></div>`;

/* Canción */
(function () {
  const c = CONFIG.cancion, box = $("song");
  if (c.embedUrl) {
    box.style.width = "min(440px, 100%)";
    box.innerHTML = `<iframe src="${esc(c.embedUrl)}" height="152" allow="encrypted-media" loading="lazy" title="Canción"></iframe>`;
  } else {
    box.innerHTML = `<div class="song"><div class="disc"><svg width="22" height="22" viewBox="0 0 24 24" fill="#fff4f1"><path d="M9 18V6l11-2v12a3 3 0 1 1-2-2.800V7.500L11 8.700V18a3 3 0 1 1-2-2.800z"/></svg></div><div><b>${esc(c.titulo)}</b><small>${esc(c.artista)}</small></div></div>`;
  }
})();

/* Foto */
(function () {
  const w = $("photo-wrap");
  w.innerHTML = CONFIG.foto
    ? `<img class="photo" alt="Nosotros" src="${esc(CONFIG.foto)}">`
    : `<div class="photo photo-ph">Aquí va una foto de ustedes</div>`;
})();

/* Contador de tiempo juntos */
function pintarContador() {
  const ini = new Date(CONFIG.fechaInicio + "T00:00:00");
  const ms = Math.max(0, Date.now() - ini.getTime());
  const dias = Math.floor(ms / 86400000);
  const horas = Math.floor(ms / 3600000) % 24;
  const min = Math.floor(ms / 60000) % 60;
  $("counter").innerHTML =
    [[dias, "días"], [horas, "horas"], [min, "min"]]
      .map(([n, l]) => `<div><b>${n}</b><span>${l}</span></div>`).join("");
}
pintarContador(); setInterval(pintarContador, 30000);

/* Navegación entre pantallas */
function ir(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.toggle("active", s.id === id));
  window.scrollTo(0, 0);
  ambiente(id === "s-carta" || id === "s-pregunta" || id === "s-final");
  if (id === "s-final") subir(30);
}
document.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => ir(b.dataset.go)));

/* Sobre */
const sobre = $("envelope");
let abriendo = false;
const abrirSobre = () => {
  if (abriendo) return; abriendo = true;
  sobre.classList.add("open");
  estallido(sobre); subir(16);
  setTimeout(() => { ir("s-carta"); abriendo = false; sobre.classList.remove("open"); }, 1100);
};
$("b-leer").addEventListener("click", abrirSobre);
sobre.addEventListener("click", abrirSobre);
sobre.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); abrirSobre(); } });
$("b-tiempo").addEventListener("click", () => {
  const m = $("msg-tiempo"); m.textContent = CONFIG.mensajeTiempoSobre; m.hidden = false;
});

/* Pregunta: cada "no" hace crecer el Sí y mueve el No */
let intentos = 0;
const btnNo = $("btnNo"), btnSi = $("btnSi");
btnNo.addEventListener("click", () => {
  intentos++;
  const m = $("msg-no");
  m.textContent = CONFIG.mensajesNo[Math.min(intentos - 1, CONFIG.mensajesNo.length - 1)];
  m.hidden = false;
  btnSi.style.setProperty("--s", String(1 + intentos * 0.22));
  const dx = (Math.random() - 0.5) * 120, dy = (Math.random() - 0.5) * 60;
  btnNo.style.transform = `translate(${dx}px, ${dy}px)`;
  if (intentos >= 5) btnNo.style.display = "none";
});
btnSi.addEventListener("click", () => ir("s-final"));

/* Corazones */
const reducido = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const COLORES = ["#ff6b88", "#ff9bb0", "#ffc2cc", "#e0405f"];
const corazonSVG = (size, color) =>
  `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="${color}"><path d="M12 21s-7.5-4.6-9.5-9.2C1.2 8.4 3 5 6.4 5c2 0 3.7 1.1 5.6 3.2C13.9 6.1 15.6 5 17.6 5 21 5 22.8 8.4 21.5 11.8 19.5 16.4 12 21 12 21z"/></svg>`;
const azar = (a, b) => a + Math.random() * (b - a);
const colorAzar = () => COLORES[Math.floor(Math.random() * COLORES.length)];

/* Corazones que suben flotando y se balancean */
function subir(n) {
  if (reducido) return;
  const cont = $("hearts");
  for (let i = 0; i < n; i++) {
    const h = document.createElement("span");
    h.className = "fly";
    h.style.left = azar(0, 100) + "%";
    h.style.setProperty("--d", azar(6, 11) + "s");
    h.style.setProperty("--dl", azar(0, 1.5) + "s");
    h.style.setProperty("--dx", azar(-45, 45) + "px");
    h.style.setProperty("--r", azar(-25, 25) + "deg");
    h.innerHTML = corazonSVG(azar(12, 38), colorAzar());
    cont.appendChild(h);
    setTimeout(() => h.remove(), 14000);
  }
}

/* Explosión de corazones desde un elemento (el sobre) */
function estallido(el) {
  if (reducido) return;
  const r = el.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const cont = $("hearts");
  for (let i = 0; i < 26; i++) {
    const h = document.createElement("span");
    h.className = "pop";
    const ang = azar(0, Math.PI * 2), dist = azar(90, 260);
    h.style.left = cx + "px"; h.style.top = cy + "px";
    h.style.setProperty("--bx", Math.cos(ang) * dist + "px");
    h.style.setProperty("--by", Math.sin(ang) * dist - 70 + "px");
    h.style.animationDelay = azar(0, 0.25) + "s";
    h.innerHTML = corazonSVG(azar(14, 34), colorAzar());
    cont.appendChild(h);
    setTimeout(() => h.remove(), 2400);
  }
}

/* Lluvia suave constante mientras estás en la carta, la pregunta y el final */
let ambienteId = null;
function ambiente(activo) {
  clearInterval(ambienteId); ambienteId = null;
  if (activo && !reducido) ambienteId = setInterval(() => subir(1), 700);
}

/* ============================================================
   CARTA VIRTUAL: lógica (no necesitas editar esto)
   ============================================================ */
(function () {
  const C = CARTA_VIRTUAL;
  const PASOS = ["cv-paso1", "cv-paso2", "cv-paso3"];
  const ICONOS = {
    nota: "M9 18V6l11-2v12a3 3 0 1 1-2-2.8V7.5L11 8.7V18a3 3 0 1 1-2-2.8z",
    lugar: "M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z",
    estrella: "M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17l-6.1 3.6 1.4-6.8L2.2 9.1l6.9-.8z"
  };
  const total = C.carta.parrafos.length;
  let hechas = 0, idx = 0, listo = false, timer = null;

  const ver = (id) => PASOS.forEach(p => { $(p).hidden = p !== id; });
  const alVer = (el, bloque) => el.scrollIntoView({ behavior: reducido ? "auto" : "smooth", block: bloque || "center" });

  /* Textos fijos */
  $("cv-t1").textContent = fmt(C.sello.titulo);
  $("cv-seal-num").textContent = C.sello.numero;
  $("cv-seal-eti").textContent = C.sello.etiqueta;
  $("cv-h1").textContent = C.sello.pista;
  $("cv-t2").textContent = fmt(C.reto.titulo);
  $("cv-h2").textContent = C.reto.instruccion;
  $("cv-unlock").textContent = C.reto.botonAbrir;
  $("cv-greet").textContent = C.carta.saludo;
  $("cv-next").textContent = C.carta.botonContinuar;
  $("cv-hold-hint").textContent = C.cierre.pista;
  $("cv-hold").style.setProperty("--hold", C.cierre.msMantener / 1000 + "s");
  $("cv-sign").innerHTML = esc(C.carta.firma) + "<small>" + esc(C.carta.firmaNombre) + "</small>";

  /* Paso 2: las pistas */
  const caja = $("cv-clues");
  C.reto.pistas.forEach((p, i) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "cv-clue";
    b.innerHTML = '<span class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="' + (ICONOS[p.icono] || ICONOS.estrella) + '"/></svg></span>' +
      "<span>" + esc(p.titulo) + '</span><span class="memo" hidden>' + esc(fmt(p.recuerdo)) + "</span>";
    b.addEventListener("click", () => {
      if (b.classList.contains("done")) return;
      b.classList.add("done");
      b.querySelector(".memo").hidden = false;
      hechas++;
      $("cv-dots").children[hechas - 1].classList.add("on");
      subir(4);
      if (hechas >= C.reto.pistas.length) {
        $("cv-prog").textContent = C.reto.completado;
        $("cv-unlock").hidden = false;
        subir(10);
        alVer($("cv-unlock"));
      } else {
        $("cv-prog").textContent = hechas + " de " + C.reto.pistas.length;
      }
    });
    caja.appendChild(b);
  });
  $("cv-prog").textContent = "0 de " + C.reto.pistas.length;

  /* Paso 1 -> 2 */
  $("cv-seal").addEventListener("click", () => {
    const s = $("cv-seal");
    if (s.classList.contains("break")) return;
    s.classList.add("break");
    estallido(s); subir(10);
    setTimeout(() => { ver("cv-paso2"); alVer($("cv-paso2"), "start"); }, reducido ? 0 : 650);
  });

  /* Paso 2 -> 3 */
  $("cv-unlock").addEventListener("click", () => {
    ver("cv-paso3");
    alVer($("cv-paper"), "start");
    siguiente();
  });

  /* Paso 3: un párrafo por cada "Continuar", lo anterior se queda visible */
  function siguiente() {
    if (idx >= total) return;
    const p = document.createElement("p");
    p.className = "cv-p";
    p.textContent = fmt(C.carta.parrafos[idx]);
    $("cv-text").appendChild(p);
    idx++;
    $("cv-count").textContent = "Parte " + idx + " de " + total;
    if (idx >= total) {
      $("cv-actions").hidden = true;
      setTimeout(() => {
        $("cv-sign").hidden = false;
        $("cv-paso4").hidden = false;
        alVer($("cv-paso4"), "end");
      }, reducido ? 0 : 900);
    }
    alVer(p);
  }
  $("cv-next").addEventListener("click", siguiente);

  /* Paso 4: mantener presionado el sello */
  const sello = $("cv-hold");
  function iniciar() {
    if (listo || timer) return;
    sello.classList.add("holding");
    timer = setTimeout(completar, C.cierre.msMantener);
  }
  function cancelar() {
    if (timer) { clearTimeout(timer); timer = null; }
    sello.classList.remove("holding");
  }
  function completar() {
    timer = null; listo = true;
    sello.classList.remove("holding");
    sello.classList.add("done");
    $("cv-hold-hint").hidden = true;
    if (C.cierre.posdata) { $("cv-pd").textContent = C.cierre.posdata; $("cv-pd").hidden = false; }
    $("cv-final").textContent = C.cierre.mensajeFinal; $("cv-final").hidden = false;
    estallido(sello); subir(30);
    alVer($("cv-final"), "center");
  }
  sello.addEventListener("pointerdown", (e) => { e.preventDefault(); iniciar(); });
  ["pointerup", "pointerleave", "pointercancel"].forEach(t => sello.addEventListener(t, cancelar));
  sello.addEventListener("keydown", (e) => { if ((e.key === " " || e.key === "Enter") && !e.repeat) { e.preventDefault(); iniciar(); } });
  sello.addEventListener("keyup", (e) => { if (e.key === " " || e.key === "Enter") cancelar(); });
  sello.addEventListener("contextmenu", (e) => e.preventDefault());

  /* Al tocar "Volver a leer", la carta vuelve a empezar */
  $("b-volver").addEventListener("click", () => {
    cancelar();
    hechas = 0; idx = 0; listo = false;
    $("cv-seal").classList.remove("break");
    document.querySelectorAll(".cv-clue").forEach(b => { b.classList.remove("done"); b.querySelector(".memo").hidden = true; });
    [...$("cv-dots").children].forEach(d => d.classList.remove("on"));
    $("cv-prog").textContent = "0 de " + C.reto.pistas.length;
    $("cv-unlock").hidden = true;
    $("cv-text").innerHTML = "";
    $("cv-sign").hidden = true; $("cv-pd").hidden = true;
    $("cv-actions").hidden = false; $("cv-paso4").hidden = true;
    $("cv-hold-hint").hidden = false; $("cv-final").hidden = true;
    sello.classList.remove("done");
    ver("cv-paso1");
  });
})();
</script>
